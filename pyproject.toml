[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dependency-installation-consistency-artifact"
version = "0.1.0"
description = "Implementation and replay entry points for dependency installation consistency"
requires-python = ">=3.11"
dependencies = ["packaging==26.3", "PyYAML==6.0.3", "uv==0.13.7", "pip==26.3"]

[tool.setuptools.packages.find]
include = ["drc*", "artifact_tools*"]
