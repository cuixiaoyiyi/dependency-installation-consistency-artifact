[project]
name="ultralytics-official-extra-control"
version="0.0.0"
requires-python="==3.11.16"
dependencies=["ultralytics[extra]==8.4.208", "torch>=1.8.0", "torchvision>=0.9.0"]

[tool.uv]
package=false
environments=['sys_platform == "linux" and platform_machine == "x86_64" and python_full_version == "3.11.16"']

[tool.uv.sources]
torch={index="pytorch-cpu"}
torchvision={index="pytorch-cpu"}

[[tool.uv.index]]
name="pytorch-cpu"
url="https://download.pytorch.org/whl/cpu"
explicit=true

[[tool.uv.index]]
name="pypi"
url="https://pypi.org/simple"
default=true
